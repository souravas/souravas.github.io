<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; frame-src 'self' blob:; connect-src 'self' https://cloudflareinsights.com; base-uri 'self'; form-action 'none'; object-src 'none'; upgrade-insecure-requests" />

  <title>Hello Interview</title>
  <meta name="description" content="Opens the Hello Interview link saved in this browser." />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" href="/favicon.ico?v=3" sizes="48x48" />
  <link rel="icon" href="/favicon-32x32.png?v=3" sizes="32x32" type="image/png" />
  <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />

  <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-tight.woff2" crossorigin fetchpriority="high" />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/jetbrains-mono.woff2" crossorigin fetchpriority="high" />

  <link rel="stylesheet" href="/hello-interview/style.css" />
  <script type="module" src="/hello-interview/main.js"></script>
</head>
<body>
  <main class="page">
    <header class="head">
      <a class="back" href="/start/"><span aria-hidden="true">‹ </span>Start</a>
      <h1>Hello Interview</h1>
    </header>

    <div class="content">
      <form class="edit" id="edit" hidden>
        <p>Your link is saved in this browser. Change it later at <a href="#edit">souravas.com/hello-interview/#edit</a>.</p>
        <label class="field-label" for="url">Hello Interview link</label>
        <input class="urls" id="url" type="text" inputmode="url" required autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://… or file:///…" aria-describedby="status" />
        <button class="retry" type="submit">Save</button>
        <p class="status" id="status" role="status"></p>
        <p class="note" id="file-help">Choose a local file to open a copy saved in this browser.</p>
        <label class="retry picker">Choose local file<input id="choose-file" type="file" accept=".html,.htm,.xhtml,.pdf,.txt,.png,.jpg,.jpeg,.webp,.gif,.avif,.svg" aria-describedby="file-help" /></label>
      </form>

      <section id="local-file" hidden>
        <div class="file-toolbar">
          <span id="filename"></span>
          <a href="#edit">Change link or file</a>
        </div>
        <div id="file-viewer"></div>
      </section>
    </div>
  </main>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "40e800aeadd0416d922cd4df15f80f38"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
