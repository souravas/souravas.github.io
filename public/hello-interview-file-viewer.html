<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' data: blob:; img-src data: blob:; font-src data: blob:; media-src data: blob:; base-uri 'none'; form-action 'none'" />
  <title>Local file viewer</title>
  <script>
    // The parent frames this viewer with a sandbox and sends only the selected file.
    const site = location.origin;
    addEventListener('message', function showFile(event) {
      if (parent === window || event.source !== parent || event.origin !== site || !(event.data instanceof Blob)) return;
      removeEventListener('message', showFile);
      location.replace(URL.createObjectURL(event.data));
    });
  </script>
</head>
</html>
